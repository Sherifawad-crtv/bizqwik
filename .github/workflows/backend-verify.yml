# Phase 6 — local-only backend checks. Never deploys; never uses Production secrets.
name: backend-verify

on:
  pull_request:
  push:
    branches: [dev-mahmoud, main]

concurrency:
  group: backend-verify-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  dry:
    name: Contract fixtures (dry)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Fixture smoke
        run: bash scripts/backend-verify.sh --dry

  live:
    name: Local Supabase (live)
    runs-on: ubuntu-latest
    needs: dry
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Detect backend path changes
        id: paths
        run: |
          if [[ "${{ github.event_name }}" == "push" ]]; then
            echo "run=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          BASE="${{ github.event.pull_request.base.sha }}"
          HEAD="${{ github.event.pull_request.head.sha }}"
          if git diff --name-only "$BASE...$HEAD" | grep -E '^(supabase/|scripts/backend-verify\.sh|\.github/workflows/backend-verify\.yml)' >/dev/null; then
            echo "run=true" >> "$GITHUB_OUTPUT"
          else
            echo "run=false" >> "$GITHUB_OUTPUT"
            echo "No supabase/verify path changes — skipping live stack."
          fi

      - uses: supabase/setup-cli@v1
        if: steps.paths.outputs.run == 'true'
        with:
          version: latest

      - name: Start local Supabase
        if: steps.paths.outputs.run == 'true'
        run: supabase start

      - name: Reset DB + serve + verify live
        if: steps.paths.outputs.run == 'true'
        run: bash scripts/backend-verify.sh --ci

      - name: Stop local Supabase
        if: always() && steps.paths.outputs.run == 'true'
        run: supabase stop || true
